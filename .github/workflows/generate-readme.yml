name: Generate README

on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - '.github/workflows/generate-readme.yml'
      - 'scripts/generate-readme.js'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

# Required so the workflow can commit the regenerated README back to main.
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    # Belt-and-braces against self-triggered loops. The commit also carries
    # [skip ci], but `paths:` filters above won't fire on a README-only push
    # anyway.
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Generate README
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/generate-readme.js

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/cache/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update README [skip ci]"
            git push
          fi
